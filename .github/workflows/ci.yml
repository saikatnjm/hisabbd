# Runs on every pull request and on pushes to main, so a broken build never
# reaches Vercel's production deploy. Mirrors the local Docker commands:
#   check → docker compose run --rm app npm run check
#   e2e   → docker compose run --rm e2e
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image and Playwright version as the local `e2e` compose service.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: "true"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
