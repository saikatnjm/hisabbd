services:
  app:
    build: .
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "${HISABBD_PORT:-3001}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  # Browser smoke tests: docker compose run --rm e2e (see docs/development.md).
  # The Playwright image ships Chromium and its system libraries, which the
  # non-root app image cannot install. Same repo mount and node_modules volume
  # as app; .next is a private tmpfs so the build never touches the dev
  # server's next_cache volume. The profile keeps it out of `docker compose up`.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    working_dir: /app
    user: "1000:1000"
    command: npm run e2e
    init: true
    shm_size: "1gb"
    environment:
      HOME: /tmp
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    tmpfs:
      - /app/.next:uid=1000,gid=1000,mode=0755,exec

volumes:
  node_modules:
  next_cache:
